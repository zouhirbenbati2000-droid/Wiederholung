<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiederholungsübungen</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #e65100; }
        .tab-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 24px; border: none; background: #e0e0e0; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 16px; }
        .tab-btn.active { background: #e65100; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Karteikarten Style */
        .card { background: #fff3e0; border-left: 6px solid #ef6c00; padding: 18px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .card-answer { display: none; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #ffa726; color: #1b5e20; font-weight: bold; }

        /* Quiz Style */
        .question-box { background: #fafafa; border: 1px solid #ddd; padding: 18px; border-radius: 8px; margin-bottom: 20px; }
        .options { margin-top: 12px; }
        .option-btn { display: block; width: 100%; text-align: left; padding: 10px; margin: 6px 0; border: 1px solid #ccc; background: #fff; border-radius: 5px; cursor: pointer; font-size: 15px; }
        .option-btn:hover { background: #f0f0f0; }
        .feedback { margin-top: 12px; font-weight: bold; display: none; padding: 10px; border-radius: 5px; }
        .feedback.correct { background: #c8e6c9; color: #2e7d32; }
        .feedback.incorrect { background: #ffcdd2; color: #c62828; }
    </style>
</head>

    <h1>Wiederholungsübungen</h1>
